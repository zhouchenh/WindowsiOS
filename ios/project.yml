name: WindowsiOS
options:
  bundleIdPrefix: com.applevm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

# Signing (team, bundle id, style, entitlements) is not set here: it comes from
# Signing.xcconfig, which includes the optional, gitignored Signing.local.xcconfig.
# Settings in this file would override the xcconfig, so keep them out. See docs/building.md.
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WindowsiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "Resources/**"
      - path: Sources/Resources/henge-jit.js
        buildPhase: resources
      # builtin-jit: the messages the app and its JIT helper exchange, and the licences of the
      # helper's StikJIT and of the pairing library (copied as the folder legal/).
      - path: WinJITHelper/WinJITMessages.swift
      - path: Sources/Resources/legal
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Apple VM
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # chrome: the status bar is shown (on the iPhone Duo in its vertical bar) except in immersive
        # mode, which hides it from the view controller (SwiftUI .statusBarHidden).
        UIStatusBarHidden: false
        CADisableMinimumFrameDurationOnPhone: true
        UIViewControllerBasedStatusBarAppearance: true
        NSMicrophoneUsageDescription: "Windows uses the microphone for voice input and audio recording."
        # Port forwards open to the local network (Settings > Port forwarding, PortForwardingView.swift). The
        # Bonjour type is only browsed to learn whether Local Network access was granted; nothing is advertised.
        NSLocalNetworkUsageDescription: "Pairs this iPhone with Apple VM for Built-in JIT, and lets other devices on your network or VPN reach Windows through port forwards you set up (for example SSH or Remote Desktop)."
        NSBonjourServices:
          - _applevm._tcp
          - _remotepairing-pairable-host._tcp
          - _remotepairing._tcp
        # applevm:// brings the app back from LocalDevVPN (localdevvpn://enable?scheme=applevm);
        # applevm://enable-jit asks StikDebug for JIT (JITSetup.swift)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - applevm
        # canOpenURL answers for these: is StikDebug / LocalDevVPN installed
        LSApplicationQueriesSchemes:
          - stikjit
          - stikdebug
          - localdevvpn
        # Game Mode (iOS 18+): background work deprioritised and lower Bluetooth latency for keyboards,
        # mice and controllers while the app is full screen. The games category is what turns it on.
        LSApplicationCategoryType: public.app-category.games
        LSSupportsGameMode: true
        GCSupportsGameMode: true
        UIBackgroundModes:
          - audio
        # builtin-jit: on-device pairing (iOS 27) advertises the first, the JIT helper finds the
        # device's RemotePairing port through the second; the pairing keeps running in the background
        # as a continued-processing task (docs/builtin-jit.md).
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).pairing.*
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    # Bundle id, team, signing style and CODE_SIGN_ENTITLEMENTS (WindowsiOS.entitlements,
    # get-task-allow) come from here; see the note at the top.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: WindowsiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: $(PROJECT_DIR)/Sources/Native/WindowsiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../core
          - $(PROJECT_DIR)/../host
          - $(PROJECT_DIR)/../devices
          - $(PROJECT_DIR)/deps/include
          - $(PROJECT_DIR)/Sources/Native
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../build/ios
          - $(PROJECT_DIR)/deps/lib
        OTHER_LDFLAGS:
          - $(inherited)
          - -lwinvm
          - -lslirp
          - -lglib-2.0
          - -lintl
          - -lpcre2-8
          - -lffi
          - -lresolv
          - -liconv
          # builtin-jit: on-device pairing (scripts/build_jit_deps.sh, ios/Sources/Native/HuskRPPairing.h)
          - -lhusk_rppairing
    dependencies:
      # builtin-jit: Built-in JIT's debugger process, embedded into PlugIns/ (docs/builtin-jit.md)
      - target: WinJITHelper
      - sdk: AVFoundation.framework
      - sdk: SafariServices.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
      # Windows in Picture in Picture (winios_pip.m) and the background test (BackgroundTest.swift)
      - sdk: AVKit.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Accelerate.framework
      - sdk: BackgroundTasks.framework
    # builtin-jit: the helper links StikJIT; it lives in the app's Frameworks with a minimal
    # Info.plist (installd refuses a framework without one), signed here when signing is on.
    # From Henge's project.yml (7b55730).
    postBuildScripts:
      - name: Embed StikJIT
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/deps/StikJIT.xcframework/ios-arm64/StikJIT.framework"
          if [ ! -d "$SRC" ]; then
            echo "error: $SRC is missing: run scripts/build_jit_deps.sh"
            exit 1
          fi
          DST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/StikJIT.framework"
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          ditto "$SRC" "$DST"
          rm -rf "$DST/Headers" "$DST/Modules" "$DST/_CodeSignature"
          # StikJIT's bundled JIT scripts are not under its MPL-2.0 (its README: they keep their own licences)
          # and are never used: the helper always runs henge-jit.js (.customBase64, forceScript).
          rm -f "$DST/universal.js" "$DST/legacy.js"
          PLIST="$DST/Info.plist"
          if [ ! -f "$PLIST" ]; then
            plutil -create xml1 "$PLIST"
            plutil -insert CFBundleIdentifier -string "$PRODUCT_BUNDLE_IDENTIFIER.StikJIT" "$PLIST"
            plutil -insert CFBundleExecutable -string StikJIT "$PLIST"
            plutil -insert CFBundleName -string StikJIT "$PLIST"
            plutil -insert CFBundlePackageType -string FMWK "$PLIST"
            plutil -insert CFBundleInfoDictionaryVersion -string 6.0 "$PLIST"
            plutil -insert CFBundleShortVersionString -string 1.9.0 "$PLIST"
            plutil -insert CFBundleVersion -string 1.9.0 "$PLIST"
            plutil -insert MinimumOSVersion -string 17.4 "$PLIST"
            plutil -insert CFBundleSupportedPlatforms -array "$PLIST"
            plutil -insert CFBundleSupportedPlatforms.0 -string iPhoneOS "$PLIST"
          fi
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DST"
          fi

  # builtin-jit: Built-in JIT's debugger (docs/builtin-jit.md). A process cannot debug itself, so
  # StikJIT runs in this app extension and attaches to the app over LocalDevVPN. iOS 26 and later.
  # From Henge's HengeJITHelper (7b55730). Its bundle id is the app's plus ".JITHelper"
  # (WinJITHelper.xcconfig): a second App ID for free teams.
  WinJITHelper:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WinJITHelper
        excludes:
          - "Info.plist"
    configFiles:
      Debug: WinJITHelper.xcconfig
      Release: WinJITHelper.xcconfig
    settings:
      base:
        PRODUCT_NAME: WinJITHelper
        INFOPLIST_FILE: WinJITHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../../Frameworks"
    dependencies:
      # StikJIT 1.9.0 (MPL-2.0) with ios/patches/stikjit-high-address.patch and stikjit-ipv6-address.patch, from
      # scripts/build_jit_deps.sh; embedded into the app's Frameworks by its Embed StikJIT script.
      - framework: deps/StikJIT.xcframework
        embed: false
